name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every Wednesday at 06:00 UTC (02:00 New Haven) so the front page
  # rolls over to the next talk after each Tuesday seminar.
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        uses: withastro/action@v3
        # Site URL and base path come from astro.config.mjs (root of yale-cosmology.github.io).
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
